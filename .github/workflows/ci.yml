name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FluxoPro.slnx
      - name: Build and test
        run: dotnet test FluxoPro.slnx --no-restore --configuration Release
      - name: Validate workflow JSON
        run: python3 -m json.tool automation/fluxopro-workflow.json > /dev/null
