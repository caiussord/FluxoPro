name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FluxoPro.slnx
      - name: Build
        run: dotnet build FluxoPro.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test FluxoPro.slnx --no-build --configuration Release
      - name: Validate browser scripts
        run: |
          node --check src/FluxoPro.Api/wwwroot/app.js
          node --check src/FluxoPro.Api/wwwroot/admin.js
      - name: Validate workflow JSON
        run: python3 -m json.tool automation/fluxopro-workflow.json > /dev/null
